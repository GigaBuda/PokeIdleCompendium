name: Apply XP calibration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply real Hunt Analyzer calibration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/HuntXpOptimizer.tsx')
          text = path.read_text(encoding='utf-8')

          marker = "const normalize = (t: string) => t.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');"
          constant = "\n\n// Calibración contra sesión real del Hunt Analyzer: 4.100 derrotas en 9h55m y 3.708.545 XP/h.\nconst XP_CALIBRATION_FACTOR = 0.9953234328;"
          if 'const XP_CALIBRATION_FACTOR = 0.9953234328;' not in text:
              if marker not in text:
                  raise SystemExit('No se encontró el punto de inserción de la calibración.')
              text = text.replace(marker, marker + constant, 1)

          old = "const xpPerHour = killsPerHour * xpPerKill;"
          new = "const xpPerHour = Math.round(killsPerHour * xpPerKill * XP_CALIBRATION_FACTOR);"
          if old not in text:
              if new not in text:
                  raise SystemExit('No se encontró la fórmula de XP/h esperada.')
          else:
              text = text.replace(old, new, 1)

          old_comment = "// Official XP per kill:\n      // VIP / Boost: +50% EXP"
          new_comment = "// Official XP per kill + calibration from real Hunt Analyzer session:\n      // VIP / Boost: +50% EXP"
          text = text.replace(old_comment, new_comment, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-xp-calibration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HuntXpOptimizer.tsx .github/workflows/apply-xp-calibration.yml
          git commit -m "Calibrar XP del optimizador con sesión real"
          git push
